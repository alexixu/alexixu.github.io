<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>儿童键盘乐园 | Alex' Blog</title>
  <meta name="description" content="给小朋友玩的本地键盘打字练习游戏，有字母、简单单词、卡通图片和按键音效。">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J0ZYYDK6Z5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-J0ZYYDK6Z5");
  </script>
  <style>
    :root {
      --bg: #fff8ed;
      --panel: #ffffff;
      --ink: #243042;
      --muted: #667085;
      --line: rgba(36, 48, 66, 0.14);
      --red: #ef4444;
      --orange: #f59e0b;
      --yellow: #facc15;
      --green: #22c55e;
      --teal: #14b8a6;
      --blue: #3b82f6;
      --violet: #8b5cf6;
      --pink: #ec4899;
      --shadow: 0 24px 70px rgba(36, 48, 66, 0.14);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 14%, rgba(250, 204, 21, 0.24), transparent 24%),
        radial-gradient(circle at 86% 12%, rgba(20, 184, 166, 0.22), transparent 26%),
        linear-gradient(135deg, #fff8ed 0%, #edf8ff 48%, #fff1f7 100%);
      font-family: Lato, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 24px 0 14px;
      font-size: 14px;
    }

    .brand {
      color: var(--ink);
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      color: #475467;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 12px 28px rgba(36, 48, 66, 0.08);
      text-decoration: none;
      backdrop-filter: blur(14px);
    }

    .nav a:hover,
    .nav a[aria-current="page"] {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .game {
      position: relative;
      min-height: calc(100vh - 84px);
      padding: 10px 0 34px;
    }

    .game-panel {
      position: relative;
      overflow: hidden;
      min-height: 690px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .game-panel:fullscreen {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      border: 0;
      border-radius: 0;
      background:
        radial-gradient(circle at 18% 14%, rgba(250, 204, 21, 0.24), transparent 24%),
        radial-gradient(circle at 86% 12%, rgba(20, 184, 166, 0.22), transparent 26%),
        linear-gradient(135deg, #fff8ed 0%, #edf8ff 48%, #fff1f7 100%);
    }

    .game-panel.is-kid-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      overflow: auto;
      border: 0;
      border-radius: 0;
      background:
        radial-gradient(circle at 18% 14%, rgba(250, 204, 21, 0.24), transparent 24%),
        radial-gradient(circle at 86% 12%, rgba(20, 184, 166, 0.22), transparent 26%),
        linear-gradient(135deg, #fff8ed 0%, #edf8ff 48%, #fff1f7 100%);
    }

    body.is-kid-fullscreen-active {
      overflow: hidden;
      user-select: none;
    }

    .game-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(59, 130, 246, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(236, 72, 153, 0.07) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.34), transparent 52%);
    }

    .toolbar,
    .score-row,
    .play-zone,
    .keyboard,
    .feedback {
      position: relative;
      z-index: 1;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 16px;
    }

    .mode-tabs,
    .tool-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mode-button,
    .tool-button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .mode-button {
      min-width: 108px;
      padding: 9px 18px;
      color: #475467;
      background: #f7fafc;
      box-shadow: inset 0 0 0 1px rgba(36, 48, 66, 0.1);
      font-weight: 700;
    }

    .mode-button[aria-pressed="true"] {
      color: #ffffff;
      background: var(--violet);
      box-shadow: 0 14px 28px rgba(139, 92, 246, 0.24);
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 52px;
      padding: 8px 14px;
      color: var(--ink);
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(36, 48, 66, 0.12), 0 10px 22px rgba(36, 48, 66, 0.08);
      font-weight: 700;
    }

    .mode-button:hover,
    .tool-button:hover {
      transform: translateY(-1px);
    }

    .score-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .score-box {
      min-height: 72px;
      padding: 12px 16px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 0 0 1px rgba(36, 48, 66, 0.1);
    }

    .score-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .score-value {
      display: block;
      color: var(--ink);
      font-size: 28px;
      font-weight: 800;
      line-height: 1.05;
    }

    .play-zone {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(280px, 0.92fr);
      gap: 16px;
      min-height: 346px;
      margin-bottom: 16px;
    }

    .target-card,
    .picture-card {
      display: flex;
      min-width: 0;
      border-radius: var(--radius);
      background: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(36, 48, 66, 0.1), 0 18px 44px rgba(36, 48, 66, 0.08);
    }

    .target-card {
      position: relative;
      overflow: hidden;
      align-items: center;
      justify-content: center;
      min-height: 346px;
      padding: 22px;
    }

    .target-card::after {
      content: "";
      position: absolute;
      right: 24px;
      bottom: 20px;
      width: 94px;
      height: 94px;
      border-radius: 34% 66% 57% 43%;
      background: color-mix(in srgb, var(--active-color, var(--blue)) 20%, transparent);
      transform: rotate(-10deg);
    }

    .target-stack {
      position: relative;
      z-index: 1;
      width: min(100%, 520px);
      text-align: center;
    }

    .target-letter {
      display: block;
      color: var(--active-color, var(--blue));
      font-size: clamp(150px, 22vw, 260px);
      font-weight: 900;
      line-height: 0.88;
      text-shadow: 0 12px 0 rgba(36, 48, 66, 0.07);
    }

    .target-word {
      display: none;
      margin: 0;
      color: var(--active-color, var(--blue));
      font-size: clamp(72px, 10vw, 142px);
      font-weight: 900;
      line-height: 1;
    }

    .letter-hint {
      min-height: 36px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
    }

    .picture-card {
      align-items: stretch;
      justify-content: center;
      min-height: 346px;
      padding: 16px;
    }

    .picture-inner {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      width: 100%;
      min-height: 100%;
      gap: 12px;
      align-items: center;
      justify-items: center;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.96)),
        color-mix(in srgb, var(--active-color, var(--blue)) 16%, #ffffff);
    }

    .picture-art {
      width: min(100%, 300px);
      aspect-ratio: 1;
    }

    .picture-art svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .picture-name {
      min-height: 42px;
      padding: 0 10px 14px;
      color: var(--ink);
      font-size: 28px;
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
    }

    .word-progress {
      display: none;
      grid-template-columns: repeat(var(--letters, 3), minmax(0, 82px));
      justify-content: center;
      gap: 10px;
      min-height: 78px;
      margin: -4px 0 16px;
    }

    .word-tile {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 74px;
      border-radius: var(--radius);
      color: var(--ink);
      background: #ffffff;
      box-shadow: inset 0 0 0 2px rgba(36, 48, 66, 0.12);
      font-size: 42px;
      font-weight: 900;
    }

    .word-tile.is-filled {
      color: #ffffff;
      background: var(--active-color, var(--blue));
      box-shadow: 0 12px 28px color-mix(in srgb, var(--active-color, var(--blue)) 24%, transparent);
    }

    .keyboard {
      display: grid;
      gap: 10px;
      padding: 18px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 0 0 1px rgba(36, 48, 66, 0.1);
    }

    .key-row {
      display: grid;
      gap: 10px;
      justify-content: center;
    }

    .key-row:nth-child(1) {
      grid-template-columns: repeat(10, minmax(58px, 82px));
    }

    .key-row:nth-child(2) {
      grid-template-columns: repeat(9, minmax(58px, 82px));
    }

    .key-row:nth-child(3) {
      grid-template-columns: repeat(7, minmax(58px, 82px));
    }

    .key {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: 0;
      border-radius: var(--radius);
      color: var(--ink);
      background: #ffffff;
      box-shadow: inset 0 -4px 0 rgba(36, 48, 66, 0.11), 0 9px 16px rgba(36, 48, 66, 0.08);
      font-size: 30px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 90ms ease, box-shadow 90ms ease, background 90ms ease, color 90ms ease;
    }

    .key.is-target {
      color: #ffffff;
      background: var(--active-color, var(--blue));
      box-shadow: inset 0 -4px 0 rgba(36, 48, 66, 0.16), 0 12px 24px color-mix(in srgb, var(--active-color, var(--blue)) 28%, transparent);
    }

    .key.is-pressed {
      transform: translateY(3px) scale(0.96);
      box-shadow: inset 0 -1px 0 rgba(36, 48, 66, 0.08), 0 4px 9px rgba(36, 48, 66, 0.08);
    }

    .feedback {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      color: #ffffff;
      background: var(--active-color, var(--blue));
      font-size: 26px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 16px 32px color-mix(in srgb, var(--active-color, var(--blue)) 20%, transparent);
    }

    .burst-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 30;
    }

    .burst {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: var(--burst-color, var(--yellow));
      animation: pop 820ms ease-out forwards;
    }

    @keyframes pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.35) rotate(0deg);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.06) rotate(220deg);
      }
    }

    .game-panel.is-word-mode .target-letter {
      display: none;
    }

    .game-panel.is-word-mode .target-word,
    .game-panel.is-word-mode .word-progress {
      display: grid;
    }

    .game-panel.is-letter-mode .picture-name {
      color: var(--muted);
      font-size: 22px;
    }

    @media (max-width: 860px) {
      .topbar,
      .toolbar,
      .play-zone,
      .score-row {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .nav {
        justify-content: flex-start;
      }

      .game-panel {
        min-height: auto;
        padding: 12px;
      }

      .play-zone {
        min-height: 0;
      }

      .target-card,
      .picture-card {
        min-height: 280px;
      }

      .tool-buttons {
        justify-content: flex-start;
      }

      .keyboard {
        width: calc(100vw - 20px);
        margin-left: 50%;
        transform: translateX(-50%);
        gap: 4px;
        padding: 8px;
      }

      .key-row {
        gap: 4px;
      }

      .key-row:nth-child(1),
      .key-row:nth-child(2),
      .key-row:nth-child(3) {
        grid-template-columns: repeat(var(--row-count), minmax(28px, 1fr));
      }

      .key {
        min-width: 0;
        font-size: clamp(18px, 5.2vw, 28px);
      }

      .word-progress {
        grid-template-columns: repeat(var(--letters, 3), minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .shell {
        width: min(100% - 20px, 1120px);
      }

      .topbar {
        padding-top: 14px;
      }

      .nav a,
      .mode-button,
      .tool-button {
        min-height: 40px;
        padding: 7px 11px;
      }

      .target-card,
      .picture-card {
        min-height: 238px;
      }

      .target-letter {
        font-size: clamp(118px, 38vw, 178px);
      }

      .target-word {
        font-size: clamp(48px, 17vw, 84px);
      }

      .picture-art {
        width: min(100%, 214px);
      }

      .picture-name {
        font-size: 22px;
      }

      .word-tile {
        height: 54px;
        font-size: 30px;
      }

      .keyboard {
        gap: 6px;
        padding: 8px;
      }

      .key-row {
        gap: 5px;
      }

      .feedback {
        min-height: 46px;
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="/">Alex' Blog</a>
    <nav class="nav" aria-label="主导航">
      <a href="/">首页</a>
      <a href="/fun/" aria-current="page">乐趣</a>
      <a href="/categories/NLP/">AI</a>
      <a href="/categories/机器学习/">机器学习</a>
      <a href="/categories/python/">Python</a>
    </nav>
  </header>

  <main class="shell game">
    <section class="game-panel is-letter-mode" data-game-panel aria-label="儿童键盘乐园" tabindex="-1">
      <div class="toolbar">
        <div class="mode-tabs" aria-label="模式">
          <button class="mode-button" type="button" data-mode="letters" aria-pressed="true">字母</button>
          <button class="mode-button" type="button" data-mode="words" aria-pressed="false">单词</button>
        </div>
        <div class="tool-buttons">
          <button class="tool-button" type="button" data-sound-toggle aria-pressed="true" aria-label="声音">♪ 开</button>
          <button class="tool-button" type="button" data-repeat aria-label="重复">↻</button>
          <button class="tool-button" type="button" data-fullscreen aria-label="全屏">⛶</button>
        </div>
      </div>

      <div class="score-row" aria-label="游戏状态">
        <div class="score-box">
          <span class="score-label">星星</span>
          <span class="score-value" data-stars>0</span>
        </div>
        <div class="score-box">
          <span class="score-label">目标</span>
          <span class="score-value" data-target-mini>A</span>
        </div>
        <div class="score-box">
          <span class="score-label">按键</span>
          <span class="score-value" data-last-key>?</span>
        </div>
      </div>

      <div class="play-zone">
        <article class="target-card" data-target-card>
          <div class="target-stack">
            <span class="target-letter" data-target-letter>A</span>
            <p class="target-word" data-target-word>CAT</p>
            <div class="letter-hint" data-letter-hint>apple</div>
          </div>
        </article>

        <article class="picture-card" aria-live="polite">
          <div class="picture-inner">
            <div class="picture-art" data-picture aria-hidden="true"></div>
            <div class="picture-name" data-picture-name>apple</div>
          </div>
        </article>
      </div>

      <div class="word-progress" data-word-progress aria-label="单词进度"></div>
      <div class="keyboard" data-keyboard aria-label="屏幕键盘"></div>
      <div class="feedback" data-feedback aria-live="polite">READY</div>
      <div class="burst-layer" data-burst-layer aria-hidden="true"></div>
    </section>
  </main>

  <script>
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"].map((row) => row.split(""));
    const colors = [
      "#ef4444", "#f97316", "#f59e0b", "#eab308", "#84cc16", "#22c55e", "#14b8a6",
      "#06b6d4", "#3b82f6", "#6366f1", "#8b5cf6", "#d946ef", "#ec4899"
    ];
    const letterWords = {
      A: "apple", B: "ball", C: "cat", D: "dog", E: "egg", F: "fish", G: "gift",
      H: "hat", I: "ice", J: "jam", K: "kite", L: "leaf", M: "moon", N: "nest",
      O: "orange", P: "pig", Q: "queen", R: "rain", S: "sun", T: "tree",
      U: "up", V: "van", W: "water", X: "box", Y: "yellow", Z: "zoo"
    };
    const letterSounds = {
      A: "ay", B: "bee", C: "see", D: "dee", E: "ee", F: "eff", G: "jee",
      H: "aitch", I: "eye", J: "jay", K: "kay", L: "ell", M: "em", N: "en",
      O: "oh", P: "pee", Q: "cue", R: "are", S: "ess", T: "tee",
      U: "you", V: "vee", W: "double you", X: "ex", Y: "why", Z: "zee"
    };
    const wordItems = [
      { word: "CAT", name: "cat", art: "cat", color: "#f97316" },
      { word: "DOG", name: "dog", art: "dog", color: "#8b5cf6" },
      { word: "SUN", name: "sun", art: "sun", color: "#f59e0b" },
      { word: "CAR", name: "car", art: "car", color: "#3b82f6" },
      { word: "FISH", name: "fish", art: "fish", color: "#14b8a6" },
      { word: "BALL", name: "ball", art: "ball", color: "#ec4899" },
      { word: "BOOK", name: "book", art: "book", color: "#22c55e" },
      { word: "CUP", name: "cup", art: "cup", color: "#06b6d4" },
      { word: "STAR", name: "star", art: "star", color: "#eab308" },
      { word: "APPLE", name: "apple", art: "apple", color: "#ef4444" }
    ];

    const panel = document.querySelector("[data-game-panel]");
    const targetLetter = document.querySelector("[data-target-letter]");
    const targetWord = document.querySelector("[data-target-word]");
    const letterHint = document.querySelector("[data-letter-hint]");
    const targetMini = document.querySelector("[data-target-mini]");
    const lastKey = document.querySelector("[data-last-key]");
    const stars = document.querySelector("[data-stars]");
    const picture = document.querySelector("[data-picture]");
    const pictureName = document.querySelector("[data-picture-name]");
    const wordProgress = document.querySelector("[data-word-progress]");
    const keyboard = document.querySelector("[data-keyboard]");
    const feedback = document.querySelector("[data-feedback]");
    const burstLayer = document.querySelector("[data-burst-layer]");
    const soundButton = document.querySelector("[data-sound-toggle]");
    const modeButtons = Array.from(document.querySelectorAll("[data-mode]"));
    const repeatButton = document.querySelector("[data-repeat]");
    const fullscreenButton = document.querySelector("[data-fullscreen]");

    let audioContext = null;
    let preferredVoice = null;
    let soundOn = true;
    let mode = "letters";
    let letterIndex = Math.floor(Math.random() * letters.length);
    let wordIndex = 0;
    let wordCursor = 0;
    let starCount = 0;
    let inputLocked = false;
    let kidHistoryArmed = false;

    function svgShell(content) {
      return `<svg viewBox="0 0 220 220" role="img" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;
    }

    const art = {
      apple: svgShell(`
        <circle cx="112" cy="112" r="62" fill="#ef4444"/>
        <circle cx="82" cy="106" r="36" fill="#fb7185"/>
        <path d="M113 50c4-22 18-34 38-36 1 21-12 38-34 41z" fill="#22c55e"/>

    function initKeyboard() {
      keyboard.innerHTML = rows.map((row) => {
        const keys = row.map((key) => `<button class="key" type="button" data-key="${key}" aria-label="${key}">${key}</button>`).join("");
        return `<div class="key-row" style="--row-count: ${row.length}">${keys}</div>`;
      }).join("");

      keyboard.addEventListener("click", (event) => {
        const keyButton = event.target.closest("[data-key]");
        if (!keyButton) return;
        handleKey(keyButton.dataset.key, keyButton);
      });
    }

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    function playKeyTone(key, isMatch) {
      if (!soundOn || !key) return;

      const ctx = getAudioContext();
      const normalized = key.toUpperCase().charCodeAt(0) || 65;
      const offset = Math.max(0, normalized - 65);
      const now = ctx.currentTime;
      const base = 196 * Math.pow(2, (offset % 26) / 12);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const waveforms = ["sine", "triangle", "square", "sawtooth"];

      osc.type = waveforms[offset % waveforms.length];
      osc.frequency.setValueAtTime(base, now);
      osc.frequency.exponentialRampToValueAtTime(base * (isMatch ? 1.5 : 1.12), now + 0.12);
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(isMatch ? 2600 : 1450, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(isMatch ? 0.18 : 0.09, now + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + (isMatch ? 0.24 : 0.16));

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + (isMatch ? 0.26 : 0.18));

      if (isMatch) {
        const sparkle = ctx.createOscillator();
        const sparkleGain = ctx.createGain();
        sparkle.type = "sine";
        sparkle.frequency.setValueAtTime(base * 2, now + 0.08);
        sparkle.frequency.exponentialRampToValueAtTime(base * 2.4, now + 0.22);
        sparkleGain.gain.setValueAtTime(0.0001, now + 0.08);
        sparkleGain.gain.exponentialRampToValueAtTime(0.11, now + 0.11);
        sparkleGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.34);
        sparkle.connect(sparkleGain);
        sparkleGain.connect(ctx.destination);
        sparkle.start(now + 0.08);
        sparkle.stop(now + 0.36);
      }
    }

    function pickEnglishVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      preferredVoice = voices.find((voice) => (
        voice.lang === "en-US" && /Samantha|Google US English|Microsoft Aria|Alex/i.test(voice.name)
      )) || voices.find((voice) => voice.lang === "en-US")
        || voices.find((voice) => voice.lang && voice.lang.startsWith("en"))
        || null;
      return preferredVoice;
    }

    if ("speechSynthesis" in window) {
      pickEnglishVoice();
      if (window.speechSynthesis.addEventListener) {
        window.speechSynthesis.addEventListener("voiceschanged", pickEnglishVoice);
      }
    }

    function createUtterance(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.voice = preferredVoice || pickEnglishVoice();
      utterance.rate = 0.68;
      utterance.pitch = 1.04;
      return utterance;
    }

    function speak(text) {
      if (!soundOn || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = createUtterance(text);
      window.speechSynthesis.speak(utterance);
    }

    function speakSequence(parts, gap = 420) {
      if (!soundOn || !("speechSynthesis" in window)) return;
      const words = parts.map((part) => String(part || "").trim()).filter(Boolean);
      if (!words.length) return;

      window.speechSynthesis.cancel();

      function playPart(index) {
        if (!soundOn || index >= words.length) return;
        const utterance = createUtterance(words[index]);
        const next = () => window.setTimeout(() => playPart(index + 1), gap);
        utterance.onend = next;
        utterance.onerror = next;
        window.speechSynthesis.speak(utterance);
      }

      playPart(0);
    }

    function speakLetter(letter) {
      speakSequence([letterSounds[letter] || letter, letterWords[letter] || ""]);
    }

    function speakWord(word) {
      speak(String(word || "").toLowerCase());
    }

    function colorForLetter(letter) {
      const index = Math.max(0, letters.indexOf(letter));
      return colors[index % colors.length];
    }

    function setColor(color) {
      panel.style.setProperty("--active-color", color);
    }

    function renderLetter() {
      const letter = letters[letterIndex];
      setColor(colorForLetter(letter));
      targetLetter.textContent = letter;
      targetMini.textContent = letter;
      letterHint.textContent = letterWords[letter] || "";
      picture.innerHTML = art[letter === "A" ? "apple" : letter === "B" ? "ball" : letter === "C" ? "cat" : letter === "D" ? "dog" : letter === "F" ? "fish" : letter === "S" ? "sun" : "star"];
      pictureName.textContent = letterWords[letter] || "";
      feedback.textContent = "READY";
      updateKeys(letter);
    }

    function currentWord() {
      return wordItems[wordIndex % wordItems.length];
    }

    function renderWord() {
      const item = currentWord();
      setColor(item.color);
      targetWord.textContent = item.word;
      targetMini.textContent = item.word[wordCursor] || item.word[0];
      letterHint.textContent = item.name;
      picture.innerHTML = art[item.art];
      pictureName.textContent = item.name;
      wordProgress.style.setProperty("--letters", item.word.length);
      wordProgress.innerHTML = item.word.split("").map((letter, index) => {
        const filled = index < wordCursor;
        return `<div class="word-tile ${filled ? "is-filled" : ""}">${filled ? letter : ""}</div>`;
      }).join("");
      feedback.textContent = item.word;
      updateKeys(item.word[wordCursor]);
    }

    function updateKeys(target) {
      document.querySelectorAll("[data-key]").forEach((key) => {
        key.classList.toggle("is-target", key.dataset.key === target);
      });
    }

    function setMode(nextMode) {
      mode = nextMode;
      inputLocked = false;
      wordCursor = 0;
      panel.classList.toggle("is-letter-mode", mode === "letters");
      panel.classList.toggle("is-word-mode", mode === "words");
      modeButtons.forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.mode === mode ? "true" : "false");
      });
      if (mode === "letters") renderLetter();
      if (mode === "words") renderWord();
    }

    function celebrate(x, y, strong) {
      const amount = strong ? 24 : 8;
      for (let i = 0; i < amount; i += 1) {
        const burst = document.createElement("span");
        const angle = (Math.PI * 2 * i) / amount;
        const distance = strong ? 150 + Math.random() * 90 : 70 + Math.random() * 45;
        burst.className = "burst";
        burst.style.left = `${x}px`;
        burst.style.top = `${y}px`;
        burst.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        burst.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        burst.style.setProperty("--burst-color", colors[(i + starCount) % colors.length]);
        burstLayer.appendChild(burst);
        window.setTimeout(() => burst.remove(), 900);
      }
    }

    function markPressed(keyButton) {
      const button = keyButton || document.querySelector(`[data-key="${CSS.escape(lastKey.textContent)}"]`);
      if (!button) return;
      button.classList.add("is-pressed");
      window.setTimeout(() => button.classList.remove("is-pressed"), 160);
    }

    function nextLetter() {
      if (mode !== "letters") {
        inputLocked = false;
        return;
      }
      const step = 1 + Math.floor(Math.random() * 6);
      letterIndex = (letterIndex + step) % letters.length;
      renderLetter();
      inputLocked = false;
    }

    function nextWord() {
      if (mode !== "words") {
        inputLocked = false;
        return;
      }
      wordIndex = (wordIndex + 1) % wordItems.length;
      wordCursor = 0;
      renderWord();
      inputLocked = false;
    }

    function centerOf(element) {
      const rect = element.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function handleKey(rawKey, keyButton) {
      const key = String(rawKey || "").toUpperCase();
      if (!/^[A-Z]$/.test(key)) return;
      if (inputLocked) return;

      const pressedButton = keyButton || document.querySelector(`[data-key="${key}"]`);
      lastKey.textContent = key;
      markPressed(pressedButton);

      if (mode === "letters") {
        const expected = letters[letterIndex];
        const match = key === expected;
        playKeyTone(key, match);
        if (match) {
          inputLocked = true;
          starCount += 1;
          stars.textContent = starCount;
          feedback.textContent = `${expected} !`;
          const point = centerOf(targetLetter);
          celebrate(point.x, point.y, true);
          speakLetter(expected);
          window.setTimeout(nextLetter, 720);
        } else {
          feedback.textContent = key;
          const point = centerOf(pressedButton);
          celebrate(point.x, point.y, false);
        }
        return;
      }

      const item = currentWord();
      const expected = item.word[wordCursor];
      const match = key === expected;
      playKeyTone(key, match);

      if (match) {
        wordCursor += 1;
        renderWord();
        const point = centerOf(pressedButton);
        celebrate(point.x, point.y, false);

        if (wordCursor >= item.word.length) {
          inputLocked = true;
          starCount += 1;
          stars.textContent = starCount;
          feedback.textContent = `${item.word} !`;
          updateKeys(null);
          const bigPoint = centerOf(picture);
          celebrate(bigPoint.x, bigPoint.y, true);
          speakWord(item.word);
          window.setTimeout(nextWord, 1050);
        }
      } else {
        feedback.textContent = key;
        const point = centerOf(pressedButton);
        celebrate(point.x, point.y, false);
      }
    }

    function isGameFullscreen() {
      return panel.classList.contains("is-kid-fullscreen");
    }

    function isExitCombo(event) {
      return event.ctrlKey && event.shiftKey && event.key === "Escape";
    }

    function blockFullscreenKeyEvent(event) {
      if (!isGameFullscreen()) return false;

      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();

      if (isExitCombo(event)) {
        leaveKidFullscreen();
        return true;
      }

      if (event.type === "keydown" && !event.metaKey && !event.ctrlKey && !event.altKey) {
        handleKey(event.key);
      }

      return true;
    }

    function blockKidFullscreenEvent(event) {
      if (!isGameFullscreen()) return false;
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation?.();
      return true;
    }

    function syncFullscreenButton() {
      const active = isGameFullscreen();
      fullscreenButton.textContent = active ? "×" : "⛶";
      fullscreenButton.setAttribute("aria-label", active ? "退出全屏" : "全屏");
    }

    function focusGamePanel() {
      if (!isGameFullscreen()) return;
      panel.focus?.({ preventScroll: true });
    }

    function armKidHistory() {
      if (kidHistoryArmed) return;

      try {
        window.history.pushState({ kidFullscreen: true }, "", window.location.href);
        kidHistoryArmed = true;
      } catch (error) {
        kidHistoryArmed = false;
      }
    }

    function disarmKidHistory() {
      if (!kidHistoryArmed) return;
      kidHistoryArmed = false;

      try {
        window.history.back();
      } catch (error) {
        // If history cannot be changed, leaving the visual lock is still safe.
      }
    }

    function enterKidFullscreen() {
      panel.classList.add("is-kid-fullscreen");
      document.body.classList.add("is-kid-fullscreen-active");
      armKidHistory();

      if (document.fullscreenElement) {
        document.exitFullscreen?.();
      }

      syncFullscreenButton();
      panel.focus?.({ preventScroll: true });
    }

    function leaveKidFullscreen() {
      panel.classList.remove("is-kid-fullscreen");
      document.body.classList.remove("is-kid-fullscreen-active");
      syncFullscreenButton();
      disarmKidHistory();
    }

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        setMode(button.dataset.mode);
        playKeyTone(button.dataset.mode === "letters" ? "L" : "W", true);
      });
    });

    soundButton.addEventListener("click", () => {
      soundOn = !soundOn;
      soundButton.setAttribute("aria-pressed", soundOn ? "true" : "false");
      soundButton.textContent = soundOn ? "♪ 开" : "♪ 关";
      if (!soundOn && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    });

    repeatButton.addEventListener("click", () => {
      if (mode === "letters") {
        const letter = letters[letterIndex];
        playKeyTone(letter, true);
        speakLetter(letter);
      } else {
        const item = currentWord();
        playKeyTone(item.word[wordCursor] || item.word[0], true);
        speakWord(item.word);
      }
    });

    fullscreenButton.addEventListener("click", () => {
      if (!isGameFullscreen()) {
        enterKidFullscreen();
      } else {
        leaveKidFullscreen();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement === panel) {
        leaveKidFullscreen();
      }
    });

    ["keydown", "keypress", "keyup"].forEach((eventName) => {
      window.addEventListener(eventName, blockFullscreenKeyEvent, true);
      document.addEventListener(eventName, blockFullscreenKeyEvent, true);
    });

    ["beforeinput", "contextmenu", "dragstart", "selectstart"].forEach((eventName) => {
      window.addEventListener(eventName, blockKidFullscreenEvent, true);
      document.addEventListener(eventName, blockKidFullscreenEvent, true);
    });

    window.addEventListener("popstate", () => {
      if (!isGameFullscreen()) return;
      armKidHistory();
    });

    window.addEventListener("focus", focusGamePanel);
    document.addEventListener("visibilitychange", focusGamePanel);

    window.addEventListener("keydown", (event) => {
      if (blockFullscreenKeyEvent(event)) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      handleKey(event.key);
    });

    initKeyboard();
    setMode("letters");
  </script>
