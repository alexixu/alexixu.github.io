<style>
  .fun-board {
    --fun-line: #e6eaf2;
    --fun-panel: #ffffff;
    --fun-text: #344054;
    --fun-heading: #101828;
    --fun-muted: #667085;
    --fun-blue: #2563eb;
    --fun-amber: #d97706;
    --fun-green: #059669;
    --fun-violet: #7c3aed;
  }

  .fun-board * {
    box-sizing: border-box;
  }

  body:has(.fun-board) .header {
    margin-bottom: 10px;
  }

  body:has(.fun-board) .site-brand-container {
    padding-bottom: 10px;
  }

  .fun-feature-panel {
    margin: 12px 0 22px;
    padding: 24px;
    border-radius: 8px;
    background:
      linear-gradient(90deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.62)),
      url("/images/home/editorial-desk-bg.png") center / cover no-repeat;
    box-shadow: 0 18px 44px rgba(15, 23, 42, 0.08);
  }

  .fun-section-title {
    margin: 0 0 14px;
    color: var(--fun-heading);
    font-size: 20px;
    font-weight: 600;
  }

  .fun-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin: 0;
  }

  .fun-card {
    position: relative;
    min-height: 164px;
    padding: 20px 20px 20px 22px;
    overflow: hidden;
    border: 1px solid var(--fun-line);
    border-radius: 8px;
    background: var(--fun-panel);
    color: var(--fun-text);
    transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
  }

  .fun-card::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 6px;
    background: var(--fun-accent, var(--fun-blue));
  }

  .fun-card::after {
    content: "";
    position: absolute;
    right: 18px;
    top: 18px;
    width: 58px;
    height: 58px;
    border-radius: 8px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--fun-accent, var(--fun-blue)) 16%, transparent), transparent);
  }

  .fun-card:hover {
    border-color: #c7d2fe;
    box-shadow: 0 14px 34px rgba(37, 99, 235, 0.08);
    transform: translateY(-2px);
  }

  .fun-card small {
    display: block;
    margin-bottom: 10px;
    color: var(--fun-muted);
    font-size: 13px;
  }

  .fun-card a,
  .fun-card strong {
    color: var(--fun-heading);
    font-size: 20px;
    font-weight: 600;
    text-decoration: none;
  }

  .fun-card a:hover {
    color: var(--fun-blue);
  }

  .fun-card p {
    margin: 10px 0 0;
    color: var(--fun-muted);
    line-height: 1.7;
  }

  .fun-card.is-music {
    --fun-accent: var(--fun-amber);
  }

  .fun-card.is-words {
    --fun-accent: var(--fun-violet);
  }

  .fun-card.is-objects {
    --fun-accent: var(--fun-green);
  }

  .fun-card.is-games {
    --fun-accent: var(--fun-blue);
  }

  .fun-card.is-empty {
    background: #fbfcff;
  }

  .fun-status {
    display: inline-flex;
    margin-left: 10px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #f2f4f7;
    color: var(--fun-muted);
    font-size: 12px;
  }

  .fun-list-panel {
    padding: 22px 24px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.94);
    box-shadow: 0 12px 28px rgba(15, 23, 42, 0.045);
  }

  .fun-link-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .fun-link-list li {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr) auto;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid rgba(230, 234, 242, 0.68);
    align-items: baseline;
  }

  .fun-link-list li:last-child {
    border-bottom: 0;
  }

  .fun-link-list span {
    color: var(--fun-muted);
    font-size: 13px;
  }

  .fun-link-list a,
  .fun-link-list strong {
    color: var(--fun-text);
    font-weight: 500;
    text-decoration: none;
  }

  .fun-link-list a:hover {
    color: var(--fun-blue);
  }

  @media (max-width: 700px) {
    body:has(.fun-board) .header {
      margin-bottom: 8px;
    }

    .fun-feature-panel {
      margin: 10px 0 20px;
      padding: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.64)),
        url("/images/home/editorial-desk-bg.png") center / cover no-repeat;
    }

    .fun-grid {
      grid-template-columns: 1fr;
    }

    .fun-card {
      min-height: auto;
    }

    .fun-list-panel {
      padding: 18px;
    }

    .fun-link-list li {
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .fun-status {
      width: fit-content;
      margin-left: 0;
    }
  }
</style>
